<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista dos Livros - Gestão de Acervo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Gestão de Acervo Bibliotecário</h1>
        <hr>
        <h2>Lista dos Livros</h2>  
        
        <div class="menu-actions">
            <a href="principal.html" class="btn btn-secondary">Menu Principal</a>
            <a href="cadastro.html" class="btn">Cadastrar Livro</a>
        </div> 

        <div class="filter-container">
            <input type="text" id="filtroTitulo" placeholder="Buscar livro pelo título...">
            <button id="filtrar">Buscar</button>
        </div>
        <p id="mensagem"></p>

        <div style="overflow-x: auto;">
            <table id="tabela">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>TÍTULO</th>
                        <th>DESCRIÇÃO</th>
                        <th>AUTOR</th>
                        <th>ESTOQUE</th>
                        <th>EDITAR</th>
                        <th>EXCLUIR</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Preenchido dinamicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = "../api_livros/public";

        async function buscarDadosTabela() {
            const resposta = await fetch(`${API_BASE}/livros`);
            if (!resposta.ok) {
                const erroData = await resposta.json();
                throw new Error(erroData.message || `Erro HTTP: ${resposta.status}`);
            }
            return await resposta.json();
        }

        async function deleteLivro(id) {
            const bodyData = { id: id };
            try {
                const resposta = await fetch(`${API_BASE}/livros`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData)
                });
                const dados = await resposta.json();
                if (!resposta.ok) {
                    throw new Error(dados.message || `Erro HTTP: ${resposta.status}`);
                }
                return dados;
            } catch (error) {
                throw error;
            }
        }

        async function preenchaTabela(dados) {
            const tabelaCorpo = document.querySelector("#tabela > tbody");
            tabelaCorpo.innerHTML = "";

            if (!dados || dados.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 7;
                td.textContent = "Nenhum livro cadastrado.";
                td.style.textAlign = "center";
                tr.appendChild(td);
                tabelaCorpo.appendChild(tr);
                return;
            }

            dados.forEach((livro) => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td>${livro.id_livro}</td>
                    <td>${livro.titulo}</td>
                    <td>${livro.descricao}</td>
                    <td>${livro.autor}</td>
                    <td>${livro.estoque !== null ? livro.estoque : "N/A"}</td>
                    <td class="edit-icon"><a href="editar.html?id=${livro.id_livro}">✏️</a></td>
                    <td class="delete-icon"><button class="btn-delete" data-id="${livro.id_livro}" data-titulo="${livro.titulo}">🗑️</button></td>
                `;

                tabelaCorpo.appendChild(tr);
            });

            // Adicionar eventos aos botões de delete
            document.querySelectorAll(".btn-delete").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute("data-id");
                    const titulo = btn.getAttribute("data-titulo");
                    if (confirm(`Tem certeza de que deseja excluir o livro "${titulo}"?`)) {
                        try {
                            await deleteLivro(id);
                            alert("Livro excluído com sucesso!");
                            location.reload();
                        } catch (e) {
                            alert("Erro ao excluir: " + e.message);
                        }
                    }
                };
            });
        }

        async function buscarLivroTitulo(titulo) {
            const params = new URLSearchParams();
            if (titulo) params.append("titulo", titulo);
            const resposta = await fetch(`${API_BASE}/livroTitulo?${params.toString()}`);
            if (!resposta.ok) {
                const erroData = await resposta.json();
                throw new Error(erroData.message || `Erro HTTP: ${resposta.status}`);
            }
            return await resposta.json();
        }

        async function filtrarLivro() {
            const msg = document.getElementById("mensagem");
            const titulo = document.getElementById("filtroTitulo").value;
            
            if (!titulo) {
               msg.textContent = "Por favor, insira um título para buscar.";
               msg.style.color = "var(--error-color)";
               const dados = await buscarDadosTabela();
               preenchaTabela(dados);
               return;
            }

            try {
                const livros = await buscarLivroTitulo(titulo);
                preenchaTabela(livros);
                msg.textContent = `Resultados para "${titulo}"`;
                msg.style.color = "var(--primary-color)";
            } catch (erro) {
                msg.textContent = `Erro ao filtrar: ${erro.message}`;
                msg.style.color = "var(--error-color)";
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const dados = await buscarDadosTabela();
                preenchaTabela(dados);
                document.getElementById("filtrar").addEventListener("click", filtrarLivro);
            } catch (e) {
                document.getElementById("mensagem").textContent = "Erro ao carregar livros.";
                document.getElementById("mensagem").style.color = "var(--error-color)";
            }
        });
    </script>
</body>
</html>
