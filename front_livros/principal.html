<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal - Gestão de Acervo</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .welcome-box {
            text-align: center;
            margin-bottom: 30px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .menu-item {
            padding: 30px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            text-align: center;
            text-decoration: none;
            color: var(--primary-dark);
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid var(--primary-light);
        }
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
            background-color: #e1bee7;
        }
        .logout-btn {
            margin-top: 40px;
            background-color: var(--error-color);
        }
        .logout-btn:hover {
            background-color: #b71c1c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-box">
            <h1>Bem-vindo ao Sistema</h1>
            <p id="mensagem">Carregando informações do usuário...</p>
        </div>

        <div class="menu-grid">
            <a href="listaLivros.html" class="menu-item">
                <div style="font-size: 40px; margin-bottom: 10px;">📚</div>
                Listar Livros
            </a>
            <a href="cadastro.html" class="menu-item">
                <div style="font-size: 40px; margin-bottom: 10px;">➕</div>
                Cadastrar Livro
            </a>
            <a href="movimentarEstoque.html" class="menu-item">
                <div style="font-size: 40px; margin-bottom: 10px;">📦</div>
                Movimentar Estoque
            </a>
        </div>

        <div style="text-align: center;">
            <button id="btnLogout" class="logout-btn">Sair do Sistema</button>
        </div>
    </div>

    <script>
        function logout() {
            sessionStorage.clear();
            window.location.href = "index.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const usuarioJson = sessionStorage.getItem("usuario");
            
            if (!usuarioJson) {
                window.location.href = "index.html";
                return;
            }

            const usuario = JSON.parse(usuarioJson);
            const msg = document.getElementById("mensagem");
            msg.textContent = `Olá, ${usuario.nome} ${usuario.sobrenome}! O que deseja fazer hoje?`;

            document.getElementById("btnLogout").addEventListener("click", logout);
        });
    </script>
</body>
</html>
