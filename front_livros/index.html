<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Acervo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container login-container">
        <h1>Página de Login</h1>
        <form id="FormLogin">
            <label for="email">E-mail:</label>
            <input type="text" id="email" placeholder="carlos.silva@empresa.com" required>
            
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Senha" required>
            
            <button type="submit">Entrar</button>
        </form>
        <p id="mensagem"></p>
    </div>

    <script>
        const API_BASE = "../api_livros/public";

        function getFormData() {
            return {
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            };
        }

        async function Login(user) {
            try {
                const resposta = await fetch(`${API_BASE}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(user)
                });

                const texto = await resposta.text();
                console.log("Resposta bruta da API:", texto);
                
                let dados;
                try {
                    dados = JSON.parse(texto);
                } catch (e) {
                    console.error("Erro ao converter para JSON:", e);
                    throw new Error("A API retornou um formato inválido. Verifique o console do navegador.");
                }

                if (!resposta.ok) {
                    throw new Error(dados.message || `Erro HTTP: ${resposta.status}`);
                }

                return dados;
            } catch (error) {
                throw error;
            }
        }

        document.getElementById("FormLogin").addEventListener("submit", async function(event) {
            event.preventDefault();
            const msg = document.getElementById("mensagem");
            const user = getFormData();
            
            msg.textContent = "Autenticando...";
            msg.style.color = "var(--primary-color)";

            try {
                const resultado = await Login(user);
                
                if (resultado && resultado.id_usuario) { 
                    sessionStorage.setItem("usuario", JSON.stringify(resultado));
                    msg.textContent = "Login realizado com sucesso! Redirecionando...";
                    msg.style.color = "var(--success-color)";
                    
                    setTimeout(() => {
                        window.location.href = "principal.html";
                    }, 1000);
                } else {
                    msg.textContent = "Login ou senha incorretos.";
                    msg.style.color = "var(--error-color)";
                }
            } catch (error) {
                msg.textContent = `Erro no login: ${error.message}`;                    
                msg.style.color = "var(--error-color)";
            }
        });
    </script>
</body>
</html>
