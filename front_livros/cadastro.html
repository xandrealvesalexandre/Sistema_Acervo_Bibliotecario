<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro - Gestão de Acervo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastrar Novo Livro</h1>
        <hr>
        
        <div class="menu-actions">
            <a href="principal.html" class="btn btn-secondary">Menu Principal</a>
            <a href="listaLivros.html" class="btn btn-secondary">Lista de Livros</a>
        </div>

        <form id="FormLivro">
            <label for="titulo">Título do Livro:</label>
            <input type="text" id="titulo" placeholder="Ex: O Senhor dos Anéis" required>
            
            <label for="autor">Autor:</label>
            <input type="text" id="autor" placeholder="Ex: J.R.R. Tolkien" required>
            
            <label for="descricao">Descrição / Sinopse:</label>
            <input type="text" id="descricao" placeholder="Breve resumo do livro..." required>
            
            <button type="submit">Cadastrar Livro</button>
        </form>
        
        <p id="mensagem"></p>
    </div>

    <script>
        const API_BASE = "../api_livros/public";

       function getFormData(){
            return{
                titulo: document.getElementById('titulo').value,
                autor: document.getElementById('autor').value,
                descricao: document.getElementById('descricao').value
            };
        }

        async function postCadastro(livro) {
            try{
                const resposta = await fetch(`${API_BASE}/livros`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(livro)
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.message || `Erro HTTP: ${resposta.status}`);
                }

                return dados;

            } catch (error) {
                throw error;
            }
        }

        async function handleFormSubmit(event){
            event.preventDefault();
            const msg = document.getElementById("mensagem");
            const livro = getFormData();
            try {
                const resultado = await postCadastro(livro);
                msg.textContent = "Livro cadastrado com sucesso!";
                msg.style.color = "var(--success-color)";
                document.getElementById("FormLivro").reset();
            } catch (error) {
                msg.textContent = `Erro ao cadastrar livro: ${error.message}`;
                msg.style.color = "var(--error-color)";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("FormLivro").addEventListener("submit", handleFormSubmit);
        });
    </script>
</body>
</html>
