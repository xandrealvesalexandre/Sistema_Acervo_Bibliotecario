<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro - Gestão de Acervo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Editar Livro</h1>
        <hr>

        <div class="menu-actions">
            <a href="listaLivros.html" class="btn btn-secondary">Voltar para Lista</a>
        </div>

        <form id="formLivro">
            <label for="id">ID do Livro:</label>
            <input type="number" id="id" required readonly>
            
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" required>
            
            <label for="autor">Autor:</label>
            <input type="text" id="autor" required>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" required>
            
            <button type="submit">Salvar Alterações</button>
        </form>

        <p id="mensagem"></p>
    </div>
    
    <script>
        const API_BASE = "../api_livros/public";

        async function getLivro(id) {
            try {
                const resposta = await fetch(`${API_BASE}/livroId?id=${id}`);
                if (!resposta.ok) {
                    const erroData = await resposta.json();
                    throw new Error(erroData.message || `Erro HTTP: ${resposta.status}`);
                }
                return await resposta.json();
            } catch (error) {
                throw error;
            }
        }

        function preencherFormulario(dados) {
            document.getElementById("id").value = dados.id_livro;
            document.getElementById("titulo").value = dados.titulo;
            document.getElementById("descricao").value = dados.descricao;
            document.getElementById("autor").value = dados.autor;
        }

        function getLivroFormData() {
            return {
                id: document.getElementById("id").value,
                titulo: document.getElementById("titulo").value,
                descricao: document.getElementById("descricao").value,
                autor: document.getElementById("autor").value
            };
        }

        async function atualizarLivro(livro) {
            try {
                const resposta = await fetch(`${API_BASE}/livros`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(livro)
                });

                const dados = await resposta.json();
                if (!resposta.ok) {
                    throw new Error(dados.message || `Erro HTTP: ${resposta.status}`);
                }
                return dados;
            } catch (error) {
                throw error;
            } 
        }

        async function enviarForm(event) {
            event.preventDefault();
            const msg = document.getElementById("mensagem");
            const livro = getLivroFormData();

            try {
                await atualizarLivro(livro);
                msg.textContent = "Livro atualizado com sucesso!";
                msg.style.color = "var(--success-color)";
            } catch (error) {
                msg.textContent = `Erro ao atualizar: ${error.message}`;
                msg.style.color = "var(--error-color)";
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            if (id) {
                try {
                    const dados = await getLivro(id);
                    preencherFormulario(dados);
                } catch (e) {
                    alert("Erro ao carregar dados do livro.");
                }
            }
            document.getElementById("formLivro").addEventListener("submit", enviarForm);
        });
    </script>
</body>
</html>
