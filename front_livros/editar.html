<!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar Livro</title>
    </head>
    <body>
        <h1>Editar Livro</h1>

        <form id="formLivro">
            <label>
                id:
            </label>
            <input type="number" id="id" required disabled>
            <br>
            <label>
                Título:
            </label>
            <input type="text" id="titulo" required>
            <br>
            <label>
                Descricao:
            </label>
            <input type="text" id="descricao" required>
            <br>
            <label>
                Autor:
            </label>
            <input type="text" id="autor" required>
            <br>
            <button type="submit">Salvar</button>
        </form>

        <p id="mensagem"></p>
        
        <script>

            const API_BASE = "http://localhost/SENAI%202026/ProjetoGestaoAcervoBibliotecario/api_livros";

            async function getLivro(id) {
                try {
                    const response = await fetch(`${API_BASE}/livroId?id=${id}`);
                    
                } catch (error) {
                    throw error;
                }
            }

            document.addEventListener("DOMContentLoaded", async () => {
                const params = new URLSearchParams(window.location.search);
                const id = params.get("id");
                const dados = await getLivro(id);
                preencherFormulario(dados);
            })
        </script>
    </body>
</html>
